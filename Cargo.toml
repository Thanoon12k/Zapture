[package]
name = "zapture"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Minimal frame-based screen recorder: drag a frame over anything, record what's inside."
categories = ["multimedia::video"]
keywords = ["screen-recorder", "screenshot", "capture"]

[dependencies]
serde_json = "1"
base64 = "0.22"

[build-dependencies]
embed-resource = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Imaging",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
