name: Publish verified alpha
on:
  push:
    paths: ['.github/workflows/publish-alpha.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      SOURCE_RUN_ID: '43394616666'
      SOURCE_SHA: '72c2d3350bc8e28925755d754bd74bd413ef98e6'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Thanoon12k/Zapture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source commit and successful platform builds
        shell: bash
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID --jq .head_sha)" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA" > /tmp/changed.txt
          gh api repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs > /tmp/jobs.json
          python3 - <<'PY'
          import json
          assert all(p.startswith(".github/workflows/") for p in open("/tmp/changed.txt").read().splitlines()), "Application source differs from tested build"
          jobs = [j for j in json.load(open('/tmp/jobs.json'))['jobs'] if j['name'].startswith('build (')]
          assert len(jobs) == 3
          assert all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '43394616666'
          path: release-assets
          merge-multiple: true
      - name: Verify archives and publish
        shell: bash
        run: |
          TAG=v0.1.0-alpha.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; refusing to overwrite."
            exit 1
          fi
          cd release-assets
          cat *.sha256 | tr -d '\r' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ..
          gh release create "$TAG" release-assets/*.zip release-assets/*.tar.gz release-assets/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Zapture $TAG — first preview" --notes-file "docs/release-notes-$TAG.md"
